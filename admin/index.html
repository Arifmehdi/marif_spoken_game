<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin — Spoken English Adventure</title>
<style>
  :root { --bg:#0e1a2f; --panel:#0a1122; --line:#22304d; --ink:#e2e8f0; --dim:#94a3b8;
          --green:#4ade80; --amber:#fbbf24; --rose:#fb7185; }
  * { box-sizing: border-box; }
  body { font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--ink);
         margin:0; padding:0; line-height:1.5; }

  /* ---- sign in ---- */
  #gate { min-height:100vh; display:grid; place-items:center; padding:24px; }
  .gate-card { width:min(380px,100%); background:var(--panel); border:2px solid var(--line);
               border-radius:18px; padding:28px; }
  .gate-card h1 { font-size:20px; margin:0 0 4px; }
  .gate-card p { color:var(--dim); font-size:13.5px; margin:0 0 20px; }
  #gate-err { color:var(--rose); font-size:13px; font-weight:700; min-height:19px; margin:8px 0 0; }

  /* ---- editor ---- */
  #app { display:none; padding:20px 24px 40px; }
  header.top { display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap; }
  header.top h1 { font-size:19px; margin:0; }
  header.top .spacer { flex:1; }
  .cols { display:grid; grid-template-columns:250px 1fr 1fr; gap:16px; align-items:start; }
  @media (max-width: 1280px) { .cols { grid-template-columns:220px 1fr; } .col-preview { grid-column:1 / -1; } }
  @media (max-width: 820px)  { .cols { grid-template-columns:1fr; } }

  /* ---- the lesson list ---- */
  .browser { background:var(--panel); border:2px solid var(--line); border-radius:12px;
             padding:10px; max-height:620px; overflow:auto; }
  .br-group + .br-group { margin-top:14px; }
  .br-head { display:flex; align-items:center; gap:7px; font-size:11px; font-weight:800;
             letter-spacing:.06em; text-transform:uppercase; color:var(--dim);
             padding:0 6px 6px; }
  .br-head .n { margin-left:auto; color:#475569; }
  .br-dot { width:8px; height:8px; border-radius:50%; }
  .br-easy   { background:var(--green); } .br-medium { background:var(--amber); }
  .br-hard   { background:var(--rose); }
  .br-item { display:block; width:100%; text-align:left; background:none; border:0;
             border-radius:9px; padding:7px 8px; cursor:pointer; font-family:inherit;
             color:var(--ink); font-weight:600; }
  .br-item:hover { background:rgba(255,255,255,.06); }
  .br-item.is-on { background:#1d3a63; }
  .br-day { font-size:10.5px; font-weight:800; color:var(--dim); letter-spacing:.04em; }
  .br-topic { font-size:13px; line-height:1.3; }
  .br-where { font-size:11px; color:var(--dim); }

  label { display:block; font-size:12px; font-weight:800; color:var(--dim);
          text-transform:uppercase; letter-spacing:.05em; margin:0 0 6px; }
  textarea, select, input {
    width:100%; background:var(--panel); color:var(--ink); border:2px solid var(--line);
    border-radius:10px; padding:11px 13px; font-size:14px; font-family:inherit; }
  textarea { min-height:440px; font-family:ui-monospace,Consolas,monospace; font-size:13px;
             line-height:1.55; white-space:pre; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:#3b82f6; }
  .row { display:flex; gap:10px; margin-bottom:14px; }
  .row > div { flex:1; }

  button { border:0; border-radius:11px; padding:12px 22px; font-size:14px; font-weight:800;
           font-family:inherit; cursor:pointer; background:linear-gradient(160deg,#4ade80,#16a34a); color:#fff; }
  button.ghost { background:#334155; }
  button.danger { background:linear-gradient(160deg,#fb7185,#e11d48); }
  button:disabled { background:#334155; cursor:not-allowed; opacity:.55; }
  .bar { display:flex; gap:10px; margin:14px 0 0; flex-wrap:wrap; }

  #out { background:var(--panel); border-radius:12px; padding:15px 17px; min-height:440px;
         font-size:13.5px; overflow:auto; border:2px solid var(--line); }
  .ok { color:var(--green); } .err { color:var(--rose); } .dim { color:var(--dim); }
  .turn { border-left:3px solid var(--line); padding:2px 0 2px 12px; margin:0 0 12px; }
  .turn.student { border-left-color:var(--green); }
  .who { font-weight:800; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--dim); }
  ul { margin:5px 0 0; padding-left:18px; } li { margin:1px 0; }
  code, pre { background:#16233d; padding:2px 6px; border-radius:6px; font-size:12.5px; }
  pre { padding:12px; overflow:auto; }
  .pill { display:inline-block; background:#16233d; color:var(--dim); border-radius:999px;
          padding:3px 11px; font-size:11.5px; font-weight:800; letter-spacing:.04em; }
</style>
</head>
<body>

<div id="gate">
  <form class="gate-card" id="gate-form">
    <h1>Lesson admin</h1>
    <p>Sign in to add or edit the conversations the game teaches.</p>
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" required />
    <p id="gate-err"></p>
    <div class="bar"><button type="submit" id="gate-go">Sign in</button></div>
  </form>
</div>

<div id="app">
  <header class="top">
    <h1>Lesson admin</h1>
    <span class="pill" id="count">—</span>
    <div class="spacer"></div>
    <a class="ghost" id="guide-link" href="guide.html"
       style="text-decoration:none; display:inline-flex; align-items:center; padding:0 18px; border-radius:11px;">Guide</a>
    <button class="danger" id="reset-all">Reset all to standard</button>
    <button class="ghost" id="signout">Sign out</button>
  </header>

  <div class="cols">
    <div>
      <label>Conversations</label>
      <div class="browser" id="browser"><p class="dim" style="padding:8px">Loading…</p></div>
      <div class="bar"><button class="ghost" id="new" style="width:100%">+ New conversation</button></div>
    </div>

    <div>
      <div class="row">
        <div><label for="day">Day number</label><select id="day"></select></div>
        <div><label for="level">Level</label><select id="level">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Difficult</option>
        </select></div>
      </div>
      <label for="src">Conversation script</label>
      <textarea id="src" spellcheck="false"></textarea>
      <div class="bar">
        <button class="ghost" id="check">Check</button>
        <button id="save" disabled>Publish to the game</button>
        <button class="ghost" id="json">Show JSON</button>
      </div>
    </div>
    <div class="col-preview">
      <label>Preview</label>
      <div id="out" class="dim">Press <b>Check</b> to validate and preview.</div>
    </div>
  </div>
</div>

<script type="module">
import { parseLessonText, lessonToText, LEVELS, LEVEL_LABELS } from "../tools/lesson-format.mjs";

const $ = (id) => document.getElementById(id);
const KEY = "sea-admin-token";
let token = sessionStorage.getItem(KEY) || "";
let ready = null;
let manifest = null;      // every lesson currently in the game
let editingDay = null;    // which one the editor is showing

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

/* --------------------------------------------------------------- sign in */

async function openApp() {
  $("gate").style.display = "none";
  $("app").style.display = "block";
  await loadManifest();
  validate();
}

$("gate-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("gate-err").textContent = "";
  $("gate-go").disabled = true;
  try {
    const res = await fetch("api/login.php", {
      method: "POST", headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ password: $("pw").value })
    });
    if (!res.ok) {
      const { error } = await res.json().catch(() => ({ error: "Sign in failed" }));
      $("gate-err").textContent = error;
      return;
    }
    token = (await res.json()).token;
    sessionStorage.setItem(KEY, token);
    $("pw").value = "";
    openApp();
  } catch {
    $("gate-err").textContent = "No admin back end here. Open this page through " +
      "npm start (port 5173), or make sure PHP is enabled in Laragon.";
  } finally {
    $("gate-go").disabled = false;
  }
});

$("signout").addEventListener("click", () => {
  sessionStorage.removeItem(KEY);
  token = "";
  location.reload();
});

/* -------------------------------------------------------------- the form */

for (let d = 1; d <= 60; d++) {
  const o = document.createElement("option");
  o.value = String(d); o.textContent = "Day " + d;
  $("day").appendChild(o);
}
$("day").value = "31";

const BLANK = `topic:      At the Library
location:   school
level:      medium
character:  Mrs. Sharma | teacher
intro:      You want to borrow a book. Ask the librarian for help.
vocabulary: borrow, return, shelf, library card

npc:  Good afternoon. Are you looking for something?

ask:  Say that you want to borrow a book.
ok:   I want to borrow a book.
ok:   I would like to borrow a book, please.
key:  borrow
type: state
hint: Try: "I want to borrow a book."

npc:  Certainly. What kind of book would you like?

ask:  Say what kind of book you want.
ok:   I would like a story book.
ok:   I am looking for a science book.
key:  book
type: state
slot: subject
hint: Try: "I would like a story book."

npc:  They are on the second shelf. Do you have your library card?

ask:  Answer about your library card.
ok:   Yes, here is my card.
ok:   No, I forgot my card.
key:  card
type: yes_no
hint: Try: "Yes, here is my card."

npc:  Thank you. You must return it in two weeks.

ask:  Ask what happens if you are late.
ok:   What happens if I return it late?
ok:   What if I am late?
key:  late
type: question
hint: Try: "What happens if I return it late?"

npc:  There is a small fine. Please try to be on time.

ask:  Thank the librarian and say goodbye.
ok:   Thank you, I will return it on time.
ok:   Thank you very much, goodbye.
key:  thank
type: state
hint: Try: "Thank you, I will return it on time."
`;

$("src").value = BLANK;

/** The checks that only bite once the lesson is live. */
function deepCheck(lesson) {
  const problems = [];
  const students = lesson.conversation.filter((t) => t.speaker === "student");
  if (students.length < 3) problems.push("a lesson needs at least 3 student turns (this has " + students.length + ")");

  lesson.conversation.forEach((turn, i) => {
    if (turn.speaker !== "student") return;
    const words = new Set(turn.expected.join(" ").toLowerCase()
      .replace(/[^a-z0-9\s']/g, " ").split(/\s+/).filter(Boolean));
    (turn.keywords || []).forEach((entry) => {
      const group = Array.isArray(entry) ? entry : [entry];
      if (!group.some((k) => words.has(k.toLowerCase()))) {
        problems.push("turn " + i + ': none of your accepted answers contain "' + group.join('" or "') + '"');
      }
    });
    if (turn.expected.every((e) => e.trim().split(/\s+/).length < 2)) {
      problems.push("turn " + i + ": every accepted answer is a single word — add at least one short full sentence");
    }
  });
  return problems;
}

function render(lesson, problems) {
  if (problems.length) {
    ready = null;
    $("save").disabled = true;
    $("out").innerHTML = '<div class="err"><b>' + problems.length + " problem" +
      (problems.length > 1 ? "s" : "") + " to fix</b></div><ul class=err>" +
      problems.map((p) => "<li>" + esc(p) + "</li>").join("") + "</ul>";
    return;
  }

  if (LEVELS.includes(lesson.difficulty)) $("level").value = lesson.difficulty;
  else lesson.difficulty = $("level").value;
  lesson.day = Number($("day").value);
  lesson.lesson_id = "day_" + String(lesson.day).padStart(3, "0");
  ready = lesson;
  $("save").disabled = false;

  const students = lesson.conversation.filter((t) => t.speaker === "student");
  const label = LEVEL_LABELS[lesson.difficulty] || lesson.difficulty;
  const html = ['<div class="ok"><b>Looks good.</b> ' + students.length + " student turns, " +
      students.reduce((s, t) => s + t.points, 0) + " points.</div>",
    '<p class="dim">Day ' + lesson.day + " · " + esc(lesson.topic) + " · " +
      esc(lesson.location) + " · " + esc(label) + "</p>"];

  for (const turn of lesson.conversation) {
    if (turn.speaker !== "student") {
      html.push('<div class="turn"><div class="who">' + esc(lesson.characters[0].name) + "</div>" +
        esc(turn.text) + "</div>");
      continue;
    }
    html.push('<div class="turn student"><div class="who">Student · ' + turn.points + " pts</div>" +
      esc(turn.prompt) +
      "<ul>" + turn.expected.map((e) => "<li>" + esc(e) + "</li>").join("") + "</ul>" +
      '<div class="dim" style="margin-top:4px">' +
        (turn.keywords || []).map((k) => "needs: " + esc(Array.isArray(k) ? k.join(" / ") : k)).join(" · ") +
        (turn.slot ? " · open slot: " + esc(turn.slot) : "") +
        " · type: " + esc(turn.expects) + "</div></div>");
  }
  $("out").innerHTML = html.join("");
}

function validate() {
  const { lesson, problems } = parseLessonText($("src").value);
  render(lesson, lesson ? deepCheck(lesson) : problems);
  return lesson;
}

/**
 * Load the index of what is in the game and draw the list.
 *
 * The list is the way in: picking a day out of a 1-60 dropdown meant knowing
 * the number of the conversation you wanted to correct. Here every one is
 * shown under its level, and clicking it opens the text.
 */
async function loadManifest() {
  try {
    manifest = await (await fetch("../data/lessons/manifest.json?t=" + Date.now())).json();
  } catch {
    manifest = null;
    $("count").textContent = "—";
    $("browser").innerHTML = '<p class="err" style="padding:8px">Could not read the lesson list.</p>';
    return;
  }

  const tally = {};
  manifest.lessons.forEach((l) => { tally[l.difficulty] = (tally[l.difficulty] || 0) + 1; });
  $("count").textContent = manifest.lessons.length + " lessons · " +
    LEVELS.map((id) => (tally[id] || 0) + " " + LEVEL_LABELS[id].toLowerCase()).join(" · ");

  renderBrowser();
}

function renderBrowser() {
  if (!manifest) return;
  $("browser").innerHTML = LEVELS.map((id) => {
    const rows = manifest.lessons
      .filter((l) => l.difficulty === id)
      .sort((a, b) => a.day - b.day)
      .map((l) =>
        '<button class="br-item' + (l.day === editingDay ? " is-on" : "") + '" data-day="' + l.day + '">' +
          '<span class="br-day">DAY ' + l.day + "</span>" +
          '<div class="br-topic">' + esc(l.topic) + "</div>" +
          '<div class="br-where">' + esc(l.location) + "</div>" +
        "</button>").join("");
    if (!rows) return "";
    return '<div class="br-group"><div class="br-head"><i class="br-dot br-' + id + '"></i>' +
      LEVEL_LABELS[id] + '<span class="n">' + (manifest.lessons.filter((l) => l.difficulty === id).length) +
      "</span></div>" + rows + "</div>";
  }).join("");

  $("browser").querySelectorAll(".br-item").forEach((b) => {
    b.addEventListener("click", () => openDay(Number(b.dataset.day)));
  });
}

/** Load one lesson back out of the game and into the editor as text. */
async function openDay(day) {
  const file = "day_" + String(day).padStart(3, "0") + ".json";
  try {
    const res = await fetch("../data/lessons/" + file + "?t=" + Date.now());
    if (!res.ok) throw new Error("Day " + day + " has not been written yet");
    const lesson = await res.json();
    $("src").value = lessonToText(lesson);
    $("day").value = String(day);
    $("level").value = lesson.difficulty || "easy";
    editingDay = day;
    renderBrowser();
    validate();
  } catch (err) {
    $("out").innerHTML = '<div class="err">' + esc(err.message) + "</div>";
  }
}

/** Next day number nothing is using yet. */
function nextFreeDay() {
  const used = new Set((manifest ? manifest.lessons : []).map((l) => l.day));
  let d = 1;
  while (used.has(d)) d++;
  return d;
}

$("check").addEventListener("click", validate);
$("day").addEventListener("change", () => { if (ready) validate(); });
$("level").addEventListener("change", () => { if (ready) validate(); });
$("src").addEventListener("input", () => { ready = null; $("save").disabled = true; });

$("json").addEventListener("click", () => {
  if (!validate() || !ready) return;
  $("out").innerHTML = "<pre>" + esc(JSON.stringify(ready, null, 2)) + "</pre>";
});

$("new").addEventListener("click", () => {
  editingDay = null;
  $("day").value = String(nextFreeDay());
  $("src").value = BLANK;
  renderBrowser();
  validate();
});

$("reset-all").addEventListener("click", async () => {
  if (!confirm("Reset all 30 standard lessons to their original text?\n\n" +
    "Every edit made to Day 1-30 will be lost. Anything you added beyond Day 30 is not touched.")) return;
  $("reset-all").disabled = true;
  try {
    const res = await fetch("api/reset.php", {
      method: "POST", headers: { "x-admin-token": token }, credentials: "same-origin"
    });
    if (res.status === 401) {
      sessionStorage.removeItem(KEY);
      $("out").innerHTML = '<div class="err">Your session ended. Reload and sign in again.</div>';
      return;
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Could not reset the lessons");

    if (editingDay) await openDay(editingDay); else await loadManifest();
    $("out").innerHTML = data.published
      ? '<div class="ok"><b>Reset ' + data.restored.length +
        " standard lesson(s) to their original text.</b> Live now — reload the game.</div>"
      : '<div class="err"><b>Lessons were reset, but the game listing could not be rebuilt.</b></div>' +
        '<p class="dim">' + esc(data.buildOutput || "Unknown problem.") + "</p>";
  } catch (err) {
    $("out").innerHTML = '<div class="err">' + esc(err.message) + "</div>";
  } finally {
    $("reset-all").disabled = false;
  }
});

$("save").addEventListener("click", async () => {
  if (!ready) return;
  const file = "data/lessons/" + ready.lesson_id + ".json";
  try {
    const res = await fetch("api/save.php", {
      method: "POST",
      headers: { "x-filename": file, "x-admin-token": token },
      credentials: "same-origin",
      body: JSON.stringify(ready, null, 2) + "\n"
    });
    if (res.status === 401) {
      sessionStorage.removeItem(KEY);
      $("out").innerHTML = '<div class="err">Your session ended. Reload and sign in again.</div>';
      return;
    }
    if (!res.ok) throw new Error(await res.text());
    const result = await res.json().catch(() => ({}));
    editingDay = ready.day;
    await loadManifest();
    $("out").innerHTML = result.published
      ? '<div class="ok"><b>Published.</b> Day ' + ready.day + ' is live — reload the game to play it.</div>'
      : '<div class="err"><b>Saved, but the game was not updated.</b></div>' +
        '<p class="dim">' + esc(result.buildOutput || "Unknown problem.") + "</p>" +
        '<p class="dim">Fix that and press Publish again.</p>';
  } catch (err) {
    $("out").innerHTML = '<div class="err">Could not publish: ' + esc(err.message) + "</div>";
  }
});

/* Restore a session across a reload, so editing is not interrupted. */
(async () => {
  if (!token) return;
  try {
    const res = await fetch("api/check.php", { headers: { "x-admin-token": token }, credentials: "same-origin" });
    if (res.ok) openApp(); else sessionStorage.removeItem(KEY);
  } catch { /* stay on the gate */ }
})();
</script>
</body>
</html>
